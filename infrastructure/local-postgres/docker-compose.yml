# One shared local PostgreSQL for every service that needs a database on this machine.
#
#   cp .env.example .env                  # once: set the passwords (see the comments there)
#   docker compose up -d                  # once: creates the volume, the databases and the roles
#
# After that, start the Ledger and Knowledge as usual; they reach this container through host.docker.internal:5432.
# Nothing here runs again unless you start it: restart: unless-stopped brings the container back when Docker starts.
#
# Data lives in the named volume fintracker-pg-data. It survives removing the container or the image. It does NOT survive
# `docker compose down -v`, `docker volume rm` or `docker system prune --volumes`. Back up with pg_dumpall before those.
#
# The init scripts run only when the volume is empty (first start). To re-run them, remove the volume: that deletes all data.
name: fintracker

services:
  postgres:
    # pgvector is required by Knowledge (>= 0.8.0). Pinned to a major version: moving to another major needs a dump and restore.
    image: pgvector/pgvector:pg17
    container_name: fintracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infrastructure/local-postgres/.env}
      # The image creates this database on first start. Knowledge's roles script runs against it.
      POSTGRES_DB: knowledge
      # Knowledge's login roles (kn_app_retrieve, kn_app_ingest) read these on first start.
      KNOWLEDGE_DB_RETRIEVE_PASSWORD: ${KNOWLEDGE_DB_RETRIEVE_PASSWORD:?set KNOWLEDGE_DB_RETRIEVE_PASSWORD in .env}
      KNOWLEDGE_DB_INGEST_PASSWORD: ${KNOWLEDGE_DB_INGEST_PASSWORD:?set KNOWLEDGE_DB_INGEST_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - fintracker-pg-data:/var/lib/postgresql/data
      # Runs in filename order on the first start: 00 creates the Ledger's database, 20 creates Knowledge's roles.
      - ./init:/docker-entrypoint-initdb.d:ro
      # Knowledge's own role script, used as-is so the roles are defined in one place (services/fintracker-knowledge).
      # Mounted outside initdb.d: Docker cannot bind a file into the already-mounted initdb.d directory.
      - ../../services/fintracker-knowledge/local/init/10-roles.sh:/opt/fintracker/knowledge-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fintracker-pg-data:
    name: fintracker-pg-data
