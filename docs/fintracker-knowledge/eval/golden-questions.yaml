# Golden question set for the help-doc RAG pipeline (KN-CHUNK-04, Appendix B).
# A question is a hit when ANY expected path appears in the top 5 retrieved chunks.
# Gate: recall@5 >= 0.90, and no drop > 0.05 from the last accepted run.
# Phrase questions the way users type them, not the way the docs are worded.
# Where two docs could reasonably answer, both are listed.
#
# must_mention (used by the live chat evaluation, AI-EVAL-09; ignored by the retrieval gate):
# phrases the chat answer must contain. Every entry must match; inside an entry, "a|b" means
# either a or b. Case-insensitive substring match. Each entry must also appear in at least one
# expected doc, so the set can't drift from the docs. Use UI labels, numbers and rule words from
# the docs, not paraphrases the model might choose differently.

# --- Getting started ---------------------------------------------------------
- id: GQ-001
  question: "What tabs does FinTracker have?"
  expected_paths:
    - help/getting-started/app-overview.md
  must_mention:
    - "Dashboard"
    - "Transactions"
    - "Statements"
    - "Budgets"
    - "Reports"
    - "Accounts"
    - "Settings"

- id: GQ-002
  question: "Where do I go to see how much I spent last month?"
  expected_paths:
    - help/reports.md
    - help/getting-started/app-overview.md
  must_mention:
    - "Reports"
    - "last month"

- id: GQ-003
  question: "How do I sign in?"
  expected_paths:
    - help/getting-started/sign-in-and-session.md
  must_mention:
    - "login page|sign-in page"
    - "password"

- id: GQ-004
  question: "Why did FinTracker ask me to pick a timezone?"
  expected_paths:
    - help/getting-started/sign-in-and-session.md
  must_mention:
    - "this month|today|due dates"
    - "timezone"

- id: GQ-005
  question: "I got a warning that I'm about to be signed out. What is that?"
  expected_paths:
    - help/getting-started/sign-in-and-session.md
  must_mention:
    - "13 minutes"
    - "Stay signed in"

- id: GQ-006
  question: "How do I close my account and what happens to my data?"
  expected_paths:
    - help/getting-started/sign-in-and-session.md
    - help/settings.md
  must_mention:
    - "30-day|30 day|30 days"
    - "permanently deleted"

