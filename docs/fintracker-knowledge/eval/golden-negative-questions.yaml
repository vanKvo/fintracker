# Pass = no retrieved chunk reaches the threshold, so chat answers "I couldn't find that in the help docs".
# Fail = a chunk scores above the threshold and the assistant would answer from an unrelated doc.
# Not part of recall@5. Keep separate from golden-questions.yaml.

