<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FBF"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9730D"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker><marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/></marker></defs><rect width="1500" height="470" fill="#fff"/><text x="40" y="36" font-size="22" font-weight="bold" fill="#111" text-anchor="start">Analytics — Build the facts payload</text>
<text x="40" y="58" font-size="12" font-weight="normal" fill="#555" text-anchor="start">One workflow serves the Reports tab (numbers render first) and the AI assistant (Financial Summary input). Same functions back the chat section tools.</text>
<rect x="40" y="90" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="165.0" y="111" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">1. Request</text>
<text x="165.0" y="129" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">UI: GET /facts?period</text>
<text x="165.0" y="144" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">AI assistant: internal route</text>
<polyline points="290,128 318,128" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="320" y="90" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="445.0" y="111" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">2. Resolve context</text>
<text x="445.0" y="129" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">user · timezone · currency</text>
<text x="445.0" y="144" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">from verified context only</text>
<polyline points="570,128 598,128" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="600" y="90" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="725.0" y="111" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">3. Resolve period</text>
<text x="725.0" y="129" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">user timezone</text>
<text x="725.0" y="144" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">complete months</text>
<polyline points="850,128 878,128" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="880" y="90" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="1005.0" y="111" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">4. Load transactions</text>
<text x="1005.0" y="129" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">Ledger reporting views</text>
<text x="1005.0" y="144" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">RLS user context in txn</text>
<polyline points="1130,128 1158,128" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="1160" y="90" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="1285.0" y="111" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">5. Counting rules</text>
<text x="1285.0" y="129" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">counted rows, primary</text>
<text x="1285.0" y="144" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">currency → quality flags</text>
<polyline points="1285.0,166 1285.0,196 165.0,196 165.0,224" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="40" y="226" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="165.0" y="247" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">6. Compute sections</text>
<text x="165.0" y="265" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">cash flow · categories</text>
<text x="165.0" y="280" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">anomalies · budgets</text>
<polyline points="290,264 318,264" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="320" y="226" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="445.0" y="247" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">7. Run detectors</text>
<text x="445.0" y="265" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">fees · trials · duplicates</text>
<text x="445.0" y="280" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">leakage · velocity</text>
<polyline points="570,264 598,264" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="600" y="226" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="725.0" y="247" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">8. Rank candidates</text>
<text x="725.0" y="265" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">score = impact ÷ $100</text>
<text x="725.0" y="280" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">top 8 → cand_1 … cand_8</text>
<polyline points="850,264 878,264" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="880" y="226" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="1005.0" y="247" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">9. Assemble + validate</text>
<text x="1005.0" y="265" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">Appendix A schema</text>
<text x="1005.0" y="280" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">null + reason if missing</text>
<polyline points="1130,264 1158,264" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<rect x="1160" y="226" width="250" height="76" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
<text x="1285.0" y="247" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">10. Hash + return</text>
<text x="1285.0" y="265" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">facts_hash for the</text>
<text x="1285.0" y="280" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">AI assistant's cache key</text>
<rect x="40" y="336" width="700" height="66" rx="8" fill="#F2F2F2" stroke="#555555" stroke-width="1.6"/>
<text x="390.0" y="357" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">On failure</text>
<text x="390.0" y="375" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">detector error → logged, skipped, listed in data_quality.skipped_detectors; generation continues</text>
<text x="390.0" y="390" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">facts engine failure → caller shows an error state; the AI assistant does not call the LLM</text>
<rect x="770" y="336" width="690" height="66" rx="8" fill="#F2F2F2" stroke="#555555" stroke-width="1.6"/>
<text x="1115.0" y="357" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Never in the payload</text>
<text x="1115.0" y="375" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">account numbers · raw descriptions · names · emails · bank names · account nicknames</text>
<text x="1115.0" y="390" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">accounts appear only as opaque account_ref; merchants are normalized</text>
<rect x="40" y="420" width="1420" height="40" rx="8" fill="#FBFBFB" stroke="#ccc"/>
<rect x="56" y="433" width="22" height="14" fill="#FFF4E5" stroke="#E8890C"/>
<text x="86" y="445" font-size="12" font-weight="normal" fill="#222" text-anchor="start">Analytics step</text>
<rect x="195.60000000000002" y="433" width="22" height="14" fill="#F2F2F2" stroke="#555555"/>
<text x="225.60000000000002" y="445" font-size="12" font-weight="normal" fill="#222" text-anchor="start">rule</text>
<polyline points="271.20000000000005,440 311.20000000000005,440" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#mk)"/>
<text x="319.20000000000005" y="445" font-size="12" font-weight="normal" fill="#222" text-anchor="start">flow</text></svg>