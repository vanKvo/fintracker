<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1090" viewBox="0 0 1560 1090" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FBF"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9730D"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <rect width="1560" height="1090" fill="#ffffff"/>
  <text x="40" y="45" font-size="24" font-weight="bold" fill="#111">FinTracker — recommended AWS architecture</text>
  <text x="40" y="68" font-size="13" fill="#555">Serverless-first, event-driven; Fargate only where long-lived connections or steady load demand it</text>

  <!-- VPC boundary -->
  <rect x="880" y="270" width="640" height="410" rx="10" fill="#FAFBFD" stroke="#6B7C93" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="1200" y="292" font-size="12" fill="#4A5A70" text-anchor="middle" font-weight="bold">VPC · private subnets · 2 AZs</text>

  <!-- Edge row -->
  <rect x="40" y="100" width="170" height="64" rx="8" fill="#F2F2F2" stroke="#555"/>
  <text x="125" y="128" font-size="14" font-weight="bold" text-anchor="middle">Web / Mobile</text>
  <text x="125" y="147" font-size="12" text-anchor="middle" fill="#444">client</text>

  <rect x="40" y="200" width="170" height="64" rx="8" fill="#F2F2F2" stroke="#555"/>
  <text x="125" y="226" font-size="14" font-weight="bold" text-anchor="middle">Cognito</text>
  <text x="125" y="245" font-size="12" text-anchor="middle" fill="#444">user pool → issues JWT</text>

  <rect x="260" y="100" width="190" height="64" rx="8" fill="#F2F2F2" stroke="#555"/>
  <text x="355" y="128" font-size="14" font-weight="bold" text-anchor="middle">CloudFront + WAF</text>
  <text x="355" y="147" font-size="12" text-anchor="middle" fill="#444">static app · edge protection</text>

  <rect x="500" y="100" width="320" height="64" rx="8" fill="#F2F2F2" stroke="#555"/>
  <text x="660" y="128" font-size="14" font-weight="bold" text-anchor="middle">API Gateway (HTTP API)</text>
  <text x="660" y="147" font-size="12" text-anchor="middle" fill="#444">Cognito JWT authorizer · throttling</text>

  <rect x="1250" y="100" width="250" height="64" rx="8" fill="#F2F2F2" stroke="#555"/>
  <text x="1375" y="128" font-size="14" font-weight="bold" text-anchor="middle">ALB (public subnet)</text>
  <text x="1375" y="147" font-size="12" text-anchor="middle" fill="#444">chat streaming (SSE)</text>

  <!-- Edge arrows -->
  <line x1="210" y1="132" x2="258" y2="132" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="450" y1="132" x2="498" y2="132" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
  <polyline points="355,100 355,82 1375,82 1375,98" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
  <line x1="125" y1="164" x2="125" y2="198" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="132" y="186" font-size="11" fill="#444">sign in</text>

  <!-- Services row -->
  <rect x="240" y="300" width="180" height="100" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
  <text x="330" y="328" font-size="14" font-weight="bold" text-anchor="middle">User Profile</text>
  <text x="330" y="348" font-size="12" text-anchor="middle" fill="#B25E00">Lambda</text>
  <text x="330" y="368" font-size="11" text-anchor="middle" fill="#444">DynamoDB</text>
  <text x="330" y="384" font-size="11" text-anchor="middle" fill="#444">Cognito sub → userId</text>

  <rect x="440" y="300" width="180" height="100" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
  <text x="530" y="328" font-size="14" font-weight="bold" text-anchor="middle">Documents</text>
  <text x="530" y="348" font-size="12" text-anchor="middle" fill="#B25E00">Lambda</text>
  <text x="530" y="368" font-size="11" text-anchor="middle" fill="#444">presigned URLs · metadata</text>
  <text x="530" y="384" font-size="11" text-anchor="middle" fill="#444">S3 + DynamoDB</text>

  <rect x="640" y="300" width="200" height="100" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
  <text x="740" y="328" font-size="14" font-weight="bold" text-anchor="middle">Analytics</text>
  <text x="740" y="348" font-size="12" text-anchor="middle" fill="#B25E00">Lambda + EB Scheduler</text>
  <text x="740" y="368" font-size="11" text-anchor="middle" fill="#444">read model in DynamoDB</text>
  <text x="740" y="384" font-size="11" text-anchor="middle" fill="#444">AI summary via Bedrock</text>

  <rect x="900" y="300" width="200" height="100" rx="8" fill="#FFF4E5" stroke="#E8890C" stroke-width="1.6"/>
  <text x="1000" y="328" font-size="14" font-weight="bold" text-anchor="middle">Ledger</text>
  <text x="1000" y="348" font-size="12" text-anchor="middle" fill="#B25E00">Lambda + RDS Proxy</text>
  <text x="1000" y="368" font-size="11" text-anchor="middle" fill="#444">source of truth (ACID)</text>
  <text x="1000" y="384" font-size="11" text-anchor="middle" fill="#444">→ Fargate at steady load</text>

  <rect x="1300" y="300" width="200" height="100" rx="8" fill="#E8F1FB" stroke="#2F6FB3" stroke-width="1.6"/>
  <text x="1400" y="328" font-size="14" font-weight="bold" text-anchor="middle">AI Assistant</text>
  <text x="1400" y="348" font-size="12" text-anchor="middle" fill="#1F4F8F">ECS Fargate</text>
  <text x="1400" y="368" font-size="11" text-anchor="middle" fill="#444">agent loop · SSE stream</text>
  <text x="1400" y="384" font-size="11" text-anchor="middle" fill="#444">tool registry · chat history</text>

  <!-- Public API fan-out -->
  <line x1="660" y1="164" x2="335" y2="298" stroke="#222" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="660" y1="164" x2="535" y2="298" stroke="#222" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="660" y1="164" x2="735" y2="298" stroke="#222" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="660" y1="164" x2="995" y2="298" stroke="#222" stroke-width="1.4" marker-end="url(#ak)"/>
  <line x1="1375" y1="164" x2="1395" y2="298" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/>

  <!-- Internal API -->
  <rect x="1120" y="450" width="380" height="56" rx="8" fill="#EEF3FC" stroke="#1F5FBF" stroke-width="1.6"/>
  <text x="1310" y="473" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4F8F">Private API Gateway — IAM auth (SigV4)</text>
  <text x="1310" y="492" font-size="11" text-anchor="middle" fill="#444">via execute-api VPC endpoint · user JWT forwarded</text>

  <line x1="1400" y1="400" x2="1400" y2="448" stroke="#1F5FBF" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ab)"/>
  <text x="1408" y="430" font-size="11" fill="#1F5FBF">tool calls</text>
  <line x1="1120" y1="470" x2="1094" y2="403" stroke="#1F5FBF" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ab)"/>
  <polyline points="1120,497 820,497 820,402" fill="none" stroke="#1F5FBF" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ab)"/>
  <line x1="1330" y1="506" x2="1330" y2="558" stroke="#1F5FBF" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ab)"/>

  <!-- Workflow row -->
  <rect x="300" y="560" width="380" height="100" rx="8" fill="#F3ECFB" stroke="#7B4BB7" stroke-width="1.6"/>
  <text x="490" y="588" font-size="14" font-weight="bold" text-anchor="middle">Data Pipeline</text>
  <text x="490" y="608" font-size="12" text-anchor="middle" fill="#5A2F96">Step Functions + Lambda steps</text>
  <text x="490" y="628" font-size="11" text-anchor="middle" fill="#444">validate → parse → normalize → categorize → dedupe</text>
  <text x="490" y="644" font-size="11" text-anchor="middle" fill="#444">retries, DLQ, per-step state</text>

  <rect x="900" y="560" width="200" height="100" rx="8" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="1000" y="584" font-size="13" font-weight="bold" text-anchor="middle">Aurora PostgreSQL</text>
  <text x="1000" y="602" font-size="12" text-anchor="middle" fill="#1E6B40">Serverless v2</text>
  <text x="1000" y="622" font-size="11" text-anchor="middle" fill="#444">ledger DB · knowledge DB</text>
  <text x="1000" y="638" font-size="11" text-anchor="middle" fill="#444">(pgvector) — separate role each</text>

  <rect x="1160" y="560" width="340" height="100" rx="8" fill="#F3ECFB" stroke="#7B4BB7" stroke-width="1.6"/>
  <text x="1330" y="588" font-size="14" font-weight="bold" text-anchor="middle">Knowledge (RAG)</text>
  <text x="1330" y="608" font-size="12" text-anchor="middle" fill="#5A2F96">Step Functions ingest + Lambda retrieve</text>
  <text x="1330" y="628" font-size="11" text-anchor="middle" fill="#444">chunk → embed (Bedrock) → index</text>
  <text x="1330" y="644" font-size="11" text-anchor="middle" fill="#444">filter: user_id OR scope = system</text>

  <line x1="1000" y1="400" x2="1000" y2="558" stroke="#2E8B57" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#ag)"/>
  <text x="1006" y="535" font-size="11" fill="#2E8B57">via RDS Proxy</text>
  <line x1="1160" y1="610" x2="1102" y2="610" stroke="#2E8B57" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#ag)"/>

  <!-- Event bus -->
  <rect x="240" y="720" width="1260" height="48" rx="8" fill="#FFF1E3" stroke="#D9730D" stroke-width="1.6"/>
  <text x="870" y="749" font-size="14" font-weight="bold" text-anchor="middle" fill="#9A4F00">Amazon EventBridge bus  ·  SQS queue + DLQ per consumer</text>

  <!-- Event arrows -->
  <line x1="400" y1="720" x2="400" y2="662" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-end="url(#ao)"/>
  <text x="300" y="700" font-size="11" fill="#D9730D">StatementUploaded</text>
  <line x1="600" y1="660" x2="600" y2="718" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-end="url(#ao)"/>
  <text x="606" y="700" font-size="11" fill="#D9730D">StatementParsed</text>
  <polyline points="900,350 860,350 860,718" fill="none" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="874" y="700" font-size="11" fill="#D9730D" transform="rotate(-90 874 700)">Parsed in · Imported out</text>
  <line x1="720" y1="720" x2="720" y2="402" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-end="url(#ao)"/>
  <text x="726" y="545" font-size="11" fill="#D9730D" transform="rotate(-90 726 545)">TransactionsImported</text>
  <line x1="1250" y1="720" x2="1250" y2="662" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-end="url(#ao)"/>
  <text x="1256" y="700" font-size="11" fill="#D9730D">DocUploaded</text>

  <!-- Managed services row -->
  <text x="240" y="806" font-size="12" fill="#2E8B57" font-weight="bold">AWS managed services — every call uses the service's IAM execution/task role; the SDK signs SigV4 automatically; reached through VPC endpoints</text>

  <rect x="240" y="820" width="300" height="80" rx="8" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="390" y="852" font-size="14" font-weight="bold" text-anchor="middle">DynamoDB</text>
  <text x="390" y="874" font-size="11" text-anchor="middle" fill="#444">table per service · LeadingKeys = userId</text>

  <rect x="560" y="820" width="300" height="80" rx="8" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="710" y="852" font-size="14" font-weight="bold" text-anchor="middle">S3 (SSE-KMS)</text>
  <text x="710" y="874" font-size="11" text-anchor="middle" fill="#444">raw/ · processed/ · docs/{userId}/</text>

  <rect x="880" y="820" width="300" height="80" rx="8" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="1030" y="852" font-size="14" font-weight="bold" text-anchor="middle">Amazon Bedrock</text>
  <text x="1030" y="874" font-size="11" text-anchor="middle" fill="#444">LLM + embeddings · Guardrails</text>

  <rect x="1200" y="820" width="300" height="80" rx="8" fill="#EAF6EE" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="1350" y="852" font-size="14" font-weight="bold" text-anchor="middle">Secrets Manager · KMS</text>
  <text x="1350" y="874" font-size="11" text-anchor="middle" fill="#444">3rd-party API keys · encryption keys</text>

  <line x1="640" y1="818" x2="640" y2="770" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-end="url(#ao)"/>
  <text x="646" y="786" font-size="11" fill="#D9730D">ObjectCreated</text>

  <!-- Presigned upload path -->
  <polyline points="40,150 22,150 22,925 780,925 780,902" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ay)"/>
  <text x="250" y="918" font-size="11" fill="#666">presigned PUT — file goes straight to S3, never through a service</text>

  <!-- Legend -->
  <rect x="40" y="950" width="1460" height="120" rx="8" fill="#FBFBFB" stroke="#ccc"/>
  <text x="60" y="975" font-size="13" font-weight="bold">Legend</text>
  <rect x="60" y="990" width="22" height="14" fill="#FFF4E5" stroke="#E8890C"/><text x="90" y="1002" font-size="12">Lambda</text>
  <rect x="160" y="990" width="22" height="14" fill="#E8F1FB" stroke="#2F6FB3"/><text x="190" y="1002" font-size="12">ECS Fargate</text>
  <rect x="290" y="990" width="22" height="14" fill="#F3ECFB" stroke="#7B4BB7"/><text x="320" y="1002" font-size="12">Step Functions workflow</text>
  <rect x="480" y="990" width="22" height="14" fill="#EAF6EE" stroke="#2E8B57"/><text x="510" y="1002" font-size="12">Data / managed service</text>

  <line x1="60" y1="1030" x2="110" y2="1030" stroke="#222" stroke-width="1.6" marker-end="url(#ak)"/><text x="118" y="1034" font-size="12">user request: HTTPS + Cognito JWT (north–south)</text>
  <line x1="470" y1="1030" x2="520" y2="1030" stroke="#1F5FBF" stroke-width="1.8" stroke-dasharray="7,4" marker-end="url(#ab)"/><text x="528" y="1034" font-size="12">service → service sync: SigV4 (who is calling) + forwarded JWT (on whose behalf)</text>
  <line x1="60" y1="1055" x2="110" y2="1055" stroke="#D9730D" stroke-width="1.8" stroke-dasharray="2,4" marker-end="url(#ao)"/><text x="118" y="1059" font-size="12">async event (EventBridge → SQS)</text>
  <line x1="470" y1="1055" x2="520" y2="1055" stroke="#2E8B57" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#ag)"/><text x="528" y="1059" font-size="12">DB connection (IAM DB auth or Secrets Manager creds)</text>
  <line x1="960" y1="1055" x2="1010" y2="1055" stroke="#777" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#ay)"/><text x="1018" y="1059" font-size="12">direct client → S3 upload</text>
</svg>
